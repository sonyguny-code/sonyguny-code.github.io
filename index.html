<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>10일 아침 분수 연산</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#667085;--line:#d0d5dd;--soft:#eef2f6;--ok:#067647;--bad:#b42318}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:1180px;margin:auto;padding:16px 18px 80px}
.top{position:sticky;top:0;z-index:10;background:rgba(244,246,248,.95);backdrop-filter:blur(12px);padding:10px 0 12px;border-bottom:1px solid #dde2e8}
.head{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:10px;align-items:end}
h1{font-size:27px;margin:0 0 3px}.sub{font-size:13px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.timerBox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px;text-align:center}
.timer{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.finish{background:#fff3e8;border:1px solid #fedf89;color:#8a4b08}.btn:disabled{opacity:.45}
.guide{margin:13px 0;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.rules{font-size:13px;line-height:1.6;color:#475467}.rules b{color:#111827}
.problemList{display:grid;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.cardHead{display:flex;justify-content:space-between;align-items:center}.qnum{font-size:13px;font-weight:800;color:var(--muted)}.tag{font-size:12px;font-weight:800;padding:5px 8px;background:var(--soft);border-radius:999px}
.question{font-size:23px;font-weight:750;line-height:1.75;margin:8px 0 10px}
.fraction{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px;min-width:28px}
.fraction .top{border-bottom:1.7px solid currentColor;padding:0 4px 2px}.fraction .bottom{padding:2px 4px 0}
.canvasWrap{border:1px solid #cfd6df;border-radius:11px;overflow:hidden;background:#fff}
canvas{display:block;width:100%;height:205px;background:repeating-linear-gradient(0deg,transparent,transparent 31px,#eef2f6 32px);touch-action:pan-y}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tool{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px;font-weight:750}.tool.active{background:#111827;color:#fff;border-color:#111827}
.hint{display:none;margin-top:8px;padding:9px 11px;background:#fffaeb;border:1px solid #fedf89;border-radius:9px;font-size:13px;color:#7a2e0e}.hint.show{display:block}
.answer{display:none;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}.answer.show{display:block}.answerRow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.badge{background:#ecfdf3;color:#05603a;border:1px solid #abefc6;border-radius:9px;padding:8px 10px;font-weight:900}
.grade{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:900}.grade.ok.sel{background:#ecfdf3;color:var(--ok);border-color:#75e0a7}.grade.no.sel{background:#fef3f2;color:var(--bad);border-color:#fda29b}
.explain{display:none;margin-top:9px;background:#f8fafc;border:1px solid #e4e7ec;border-radius:10px;padding:11px 13px;line-height:1.7;font-size:14px}.explain.show{display:block}
.summary{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.summary.show{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#f8fafc;border:1px solid #eaecf0;border-radius:11px;padding:12px}.metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:24px;font-weight:900;margin-top:3px}
.wrongTypes{margin-top:12px;font-size:14px}.history{margin-top:16px}.history table{width:100%;border-collapse:collapse;font-size:13px}.history th,.history td{padding:8px;border-bottom:1px solid #eaecf0;text-align:left}
.hiddenCorrect{display:none}.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55}
@media(max-width:850px){.head{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.question{font-size:20px}canvas{height:190px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="head">
      <div class="brand"><h1>10일 아침 분수 연산</h1><div class="sub">매일 15문제 · 전체 범위 반복 · Apple Pencil 필기</div></div>
      <div><label>학습자</label><select id="profile"><option value="d1">딸 1</option><option value="d2">딸 2</option></select></div>
      <div><label>학습일</label><select id="day"></select></div>
      <div class="timerBox"><div class="sub">풀이 시간</div><div class="timer" id="timer">00:00</div></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="start">문제 풀기 시작</button>
      <button class="btn finish" id="finish" disabled>다 풀었어요 · 학습 종료</button>
      <button class="btn secondary" id="answers" disabled>정답 보기</button>
      <button class="btn secondary" id="reset">현재 일차 초기화</button>
    </div>
  </div>

  <div class="guide">
    <div class="rules"><b>매일 기억할 것</b>　덧셈·뺄셈 → 통분　│　곱셈 → 먼저 약분 가능한지 확인　│　나눗셈 → 두 번째 분수를 뒤집어 곱하기</div>
    <div class="sub" id="status">시작을 누르면 시간이 측정됩니다.</div>
  </div>

  <main id="list" class="problemList"></main>

  <section id="summary" class="summary">
    <h2 style="margin:0 0 12px">오늘의 결과</h2>
    <div class="metrics">
      <div class="metric"><div class="k">소요시간</div><div class="v" id="mTime">-</div></div>
      <div class="metric"><div class="k">정답</div><div class="v" id="mScore">-</div></div>
      <div class="metric"><div class="k">정답률</div><div class="v" id="mRate">-</div></div>
      <div class="metric"><div class="k">채점</div><div class="v" id="mGrade">-</div></div>
    </div>
    <div id="wrongTypes" class="wrongTypes"></div>
    <div class="actions">
      <button class="btn secondary" id="wrongOnly">틀린 문제만 다시 보기</button>
      <button class="btn secondary" id="showAll">전체 문제 보기</button>
    </div>
    <div class="history">
      <h3>10일 기록</h3>
      <table><thead><tr><th>일차</th><th>시간</th><th>점수</th><th>정답률</th></tr></thead><tbody id="hist"></tbody></table>
    </div>
  </section>
  <div class="note">기록은 이 기기의 브라우저에 저장됩니다. 손가락은 스크롤에 사용하고 Apple Pencil로 계산하도록 설계했습니다.</div>
</div>

const $=s=>document.querySelector(s);
const state={started:false,finished:false,shown:false,startAt:0,elapsed:0,timer:null,grades:[],canvases:[],day:1};
let allowTouch=false;

function dayProblems(){return DAYS[state.day-1]}
function fmt(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function storeKey(){return 'fraction10:v2:'+$('#profile').value}
function records(){try{return JSON.parse(localStorage.getItem(storeKey())||'{}')}catch{return {}}}
function saveRecord(r){const x=records();x[state.day]=r;localStorage.setItem(storeKey(),JSON.stringify(x))}
function refreshDayOptions(){
  const r=records(), old=$('#day').value||String(state.day);
  $('#day').innerHTML='';
  for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent=`${i}일차${r[i]?' ✓':''}`;$('#day').appendChild(o)}
  $('#day').value=old; state.day=+old;
}
function renderHistory(){
  const r=records(); let rows='';
  for(let i=1;i<=10;i++){const x=r[i]; rows+=x?`<tr><td>${i}일차</td><td>${fmt(x.time)}</td><td>${x.correct}/15</td><td>${x.rate}%</td></tr>`:`<tr><td>${i}일차</td><td colspan="3" style="color:#98a2b3">미완료</td></tr>`}
  $('#hist').innerHTML=rows;
}
function render(){
  const ps=dayProblems(); state.grades=Array(ps.length).fill(null); state.canvases=[];
  $('#list').innerHTML='';
  ps.forEach((p,i)=>{
    const el=document.createElement('section');el.className='card';el.dataset.i=i;
    el.innerHTML=`<div class="cardHead"><div class="qnum">${i+1}번</div><div class="tag">${p.type}</div></div>
      <div class="question">${p.q}</div>
      <div class="canvasWrap"><canvas id="cv${i}"></canvas></div>
      <div class="tools">
        <button class="tool active" data-act="pen" data-i="${i}">펜</button>
        <button class="tool" data-act="eraser" data-i="${i}">지우개</button>
        <button class="tool" data-act="undo" data-i="${i}">실행취소</button>
        <button class="tool" data-act="clear" data-i="${i}">전체지우기</button>
        <button class="tool" data-act="hint" data-i="${i}">힌트</button>
      </div>
      <div class="hint" id="hint${i}">${p.hint}</div>
      <div class="answer" id="ans${i}">
        <div class="answerRow">
          <div class="badge">정답: ${p.answer}</div>
          <button class="grade ok" data-grade="correct" data-i="${i}">○ 맞음</button>
          <button class="grade no" data-grade="wrong" data-i="${i}">× 틀림</button>
          <button class="tool" data-act="explain" data-i="${i}">풀이방법</button>
        </div>
        <div class="explain" id="exp${i}">${p.explain}</div>
      </div>`;
    $('#list').appendChild(el);
  });
  initCanvas();
  $('#summary').classList.remove('show');
}
function initCanvas(){
  dayProblems().forEach((_,i)=>{
    const c=$('#cv'+i),ctx=c.getContext('2d'),cs={c,ctx,strokes:[],mode:'pen',drawing:false,current:null};
    state.canvases.push(cs);
    function resize(){const r=c.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1);c.width=Math.floor(r.width*dpr);c.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);redraw(cs)}
    cs.resize=resize;resize();
    c.addEventListener('pointerdown',e=>{
      if(!state.started||state.finished)return;
      if(e.pointerType==='touch'&&!allowTouch)return;
      e.preventDefault();c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();const pt={x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||.5};cs.drawing=true;cs.current={mode:cs.mode,pts:[pt]};draw(cs,pt,pt,cs.mode)
    });
    c.addEventListener('pointermove',e=>{
      if(!cs.drawing||!cs.current)return;e.preventDefault();const r=c.getBoundingClientRect();const pt={x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||.5};const a=cs.current.pts.at(-1);cs.current.pts.push(pt);draw(cs,a,pt,cs.mode)
    });
    const end=()=>{if(cs.drawing){cs.drawing=false;if(cs.current){cs.strokes.push(cs.current);cs.current=null}}};
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  })
}
function draw(cs,a,b,mode){const x=cs.ctx;x.save();x.lineCap='round';x.lineJoin='round';if(mode==='eraser'){x.globalCompositeOperation='destination-out';x.lineWidth=18;x.strokeStyle='#000'}else{x.globalCompositeOperation='source-over';x.lineWidth=1.7+Math.max(.2,Math.min(1,b.p))*1.8;x.strokeStyle='#111827'}x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.restore()}
function redraw(cs){const r=cs.c.getBoundingClientRect();cs.ctx.clearRect(0,0,r.width,r.height);cs.strokes.forEach(s=>{if(s.pts.length===1)draw(cs,s.pts[0],s.pts[0],s.mode);for(let j=1;j<s.pts.length;j++)draw(cs,s.pts[j-1],s.pts[j],s.mode)})}
window.addEventListener('resize',()=>state.canvases.forEach(x=>x.resize()));

document.addEventListener('click',e=>{
  const a=e.target.dataset.act,i=+(e.target.dataset.i||0);
  if(a){
    const cs=state.canvases[i];
    if(a==='pen'||a==='eraser'){cs.mode=a;e.target.parentElement.querySelectorAll('[data-act="pen"],[data-act="eraser"]').forEach(b=>b.classList.remove('active'));e.target.classList.add('active')}
    if(a==='undo'){cs.strokes.pop();redraw(cs)}
    if(a==='clear'){cs.strokes=[];redraw(cs)}
    if(a==='hint')$('#hint'+i).classList.toggle('show');
    if(a==='explain')$('#exp'+i).classList.toggle('show');
  }
  if(e.target.dataset.grade){
    const idx=+e.target.dataset.i;state.grades[idx]=e.target.dataset.grade;
    e.target.parentElement.querySelectorAll('.grade').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel');updateGrade()
  }
});
function tick(){if(state.started&&!state.finished){state.elapsed=Date.now()-state.startAt;$('#timer').textContent=fmt(state.elapsed)}}
function setIdle(){
  clearInterval(state.timer);state.started=false;state.finished=false;state.shown=false;state.elapsed=0;$('#timer').textContent='00:00';
  $('#start').disabled=false;$('#finish').disabled=true;$('#answers').disabled=true;$('#profile').disabled=false;$('#day').disabled=false;$('#status').textContent='시작을 누르면 시간이 측정됩니다.'
}
$('#start').onclick=()=>{if(state.started)return;state.started=true;state.startAt=Date.now();state.timer=setInterval(tick,200);$('#start').disabled=true;$('#finish').disabled=false;$('#profile').disabled=true;$('#day').disabled=true;$('#status').textContent='풀이 중입니다. 정확하게 끝까지 푼 뒤 학습 종료를 누르세요.'}
$('#finish').onclick=()=>{if(!state.started||state.finished)return;state.finished=true;clearInterval(state.timer);state.elapsed=Date.now()-state.startAt;$('#timer').textContent=fmt(state.elapsed);$('#finish').disabled=true;$('#answers').disabled=false;$('#status').textContent=`풀이 종료 · ${fmt(state.elapsed)}. 이제 정답을 확인하세요.`}
$('#answers').onclick=()=>{if(!state.finished)return;state.shown=true;document.querySelectorAll('.answer').forEach(x=>x.classList.add('show'));$('#answers').disabled=true;$('#status').textContent='각 문제의 정답을 비교해 ○ 또는 ×로 채점하고, 틀린 문제는 풀이방법을 확인하세요.'}
function updateGrade(){
  const g=state.grades.filter(Boolean).length,c=state.grades.filter(x=>x==='correct').length;
  $('#status').textContent=`채점 ${g}/15`;
  if(g===15){
    const rate=Math.round(c/15*100);const wrong=state.grades.map((x,i)=>x==='wrong'?dayProblems()[i].type:null).filter(Boolean);
    const counts={};wrong.forEach(t=>counts[t]=(counts[t]||0)+1);
    $('#mTime').textContent=fmt(state.elapsed);$('#mScore').textContent=`${c}/15`;$('#mRate').textContent=`${rate}%`;$('#mGrade').textContent='15/15';
    $('#wrongTypes').innerHTML=wrong.length?`<b>다시 볼 영역:</b> ${Object.entries(counts).map(([k,v])=>`${k} ${v}문제`).join(' · ')}`:'<b>전 문제 정답입니다.</b>';
    $('#summary').classList.add('show');saveRecord({time:state.elapsed,correct:c,rate,grades:state.grades});refreshDayOptions();renderHistory();$('#status').textContent=`채점 완료 · ${c}/15 · 정답률 ${rate}%`;
    $('#summary').scrollIntoView({behavior:'smooth',block:'start'})
  }
}
$('#wrongOnly').onclick=()=>{document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('hiddenCorrect',state.grades[i]!=='wrong'));window.scrollTo({top:0,behavior:'smooth'})}
$('#showAll').onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.remove('hiddenCorrect'));window.scrollTo({top:0,behavior:'smooth'})}
$('#reset').onclick=()=>{if(!confirm(`${state.day}일차의 현재 필기와 채점 상태를 초기화할까요? 저장된 완료 기록은 유지됩니다.`))return;setIdle();render()}
$('#day').onchange=()=>{state.day=+$('#day').value;setIdle();render()}
$('#profile').onchange=()=>{refreshDayOptions();renderHistory();state.day=+$('#day').value;setIdle();render()}

refreshDayOptions();renderHistory();render();setIdle();
</script>
</body></html>
