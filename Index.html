<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>예주·예연 오늘의 수학</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#172033; --sub:#667085; --line:#dde3ec;
  --blue:#4768e6; --blue2:#eef2ff; --mint:#e9f8f1; --green:#138a5b;
  --yellow:#fff7df; --orange:#b45d09; --red:#c23838; --shadow:0 10px 28px rgba(29,41,57,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:20px 18px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.logo{font-size:21px;font-weight:900;letter-spacing:-.5px}
.date{font-size:14px;color:var(--sub);font-weight:700}
.hero{background:linear-gradient(135deg,#eef2ff,#f8fbff);border:1px solid #dfe6ff;border-radius:26px;padding:28px;box-shadow:var(--shadow);margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:31px;letter-spacing:-1px}
.hero p{margin:0;color:var(--sub);line-height:1.6}
.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.profile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);text-align:left;transition:.15s}
.profile:active{transform:scale(.99)}
.avatar{width:52px;height:52px;border-radius:18px;background:var(--blue2);display:grid;place-items:center;font-size:28px;margin-bottom:14px}
.profile h2{margin:0 0 4px;font-size:23px}.profile .grade{color:var(--sub);font-size:14px;font-weight:700}
.todayState{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{font-size:12px;font-weight:800;padding:7px 9px;border-radius:999px;background:#f2f4f7;color:#475467}
.pill.done{background:var(--mint);color:var(--green)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850}
.btn.primary{background:var(--blue);color:#fff}.btn.light{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--blue2);color:#3048ad}.btn.warn{background:#fff2e4;color:var(--orange);border:1px solid #ffd6a2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.screen{display:none}.screen.active{display:block}
.back{border:0;background:transparent;font-weight:800;color:#48566f;padding:8px 0}
.dashHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:15px}
.dashHead h1{margin:4px 0 3px;font-size:28px}.small{font-size:13px;color:var(--sub)}
.studyGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.studyCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.iconBox{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;margin-bottom:15px}
.fracIcon{background:#eef2ff}.reviewIcon{background:#fff7df}
.studyCard h3{font-size:21px;margin:0 0 5px}.studyCard p{color:var(--sub);margin:0 0 17px;line-height:1.55;font-size:14px}
.statusBox{border-top:1px solid #eef0f4;padding-top:14px;margin-top:12px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.progressWrap{background:#e9edf4;height:9px;border-radius:99px;overflow:hidden;margin:9px 0 4px}.progressBar{height:100%;width:0;background:var(--blue);transition:.2s}
.recordCard{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.recordCard h3{margin:0 0 5px}.sectionHead{position:sticky;top:0;z-index:30;background:rgba(245,247,251,.96);backdrop-filter:blur(12px);padding:10px 0 12px;border-bottom:1px solid rgba(221,227,236,.8)}
.sectionTop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.sectionTitle h2{margin:0 0 2px;font-size:23px}.timer{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:105px;text-align:center;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.problemNav{display:flex;gap:6px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}.problemNav::-webkit-scrollbar{display:none}
.navDot{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:850;color:#596579}
.navDot.active{background:var(--blue);color:#fff;border-color:var(--blue)}.navDot.graded-ok{box-shadow:inset 0 0 0 2px #62c59c}.navDot.graded-no{box-shadow:inset 0 0 0 2px #e98686}
.problem{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.problem.active{display:block}.problem.active canvas{visibility:visible}.problemMeta{display:flex;justify-content:space-between;align-items:center;gap:8px}.num{font-size:13px;font-weight:900;color:#697586}
.tag{font-size:12px;font-weight:850;background:#f2f4f7;color:#475467;border-radius:999px;padding:6px 9px}
.question{font-size:24px;font-weight:800;line-height:1.75;margin:12px 0 14px;letter-spacing:-.3px}
.fraction{display:inline-grid;grid-template-rows:auto auto;vertical-align:middle;text-align:center;line-height:1.05;margin:0 3px;min-width:30px}
.fraction .top{border-bottom:1.8px solid currentColor;padding:0 4px 2px}.fraction .bottom{padding:2px 4px 0}
.figure{margin:8px 0 16px;display:flex;justify-content:center}.figure svg{max-width:390px;width:100%;height:auto}
.canvasWrap{border:1px solid #cfd7e4;border-radius:16px;overflow:hidden;background:#fff}
canvas{display:block;width:100%;height:270px;touch-action:none;overscroll-behavior:contain;background:repeating-linear-gradient(0deg,transparent,transparent 35px,#edf1f6 36px)}
.penTools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tool{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800}.tool.active{background:#202b3f;color:#fff;border-color:#202b3f}
.hint{display:none;margin-top:9px;background:#fff9e8;border:1px solid #f8dda0;border-radius:11px;padding:10px 12px;font-size:14px;color:#7b4d0d}.hint.show{display:block}
.answer{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.answer.show{display:block}.answerRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.answerBadge{background:var(--mint);color:#08734a;border:1px solid #a8dfc7;border-radius:11px;padding:9px 11px;font-weight:900}
.gradeBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:900}.gradeBtn.ok.sel{background:#e9f8f1;color:#08734a;border-color:#80cdaa}.gradeBtn.no.sel{background:#fff0f0;color:#b12b2b;border-color:#e5a1a1}
.explain{display:none;margin-top:10px;background:#f8fafc;border:1px solid #e5e9f0;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7}.explain.show{display:block}
.bottomNav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.bottomNav .btn{min-width:110px}
.finishPanel{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.finishPanel.show{display:block}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7f9fc;border:1px solid #e8ecf2;border-radius:14px;padding:14px}.metric .k{font-size:12px;color:var(--sub)}.metric .v{font-size:25px;font-weight:900;margin-top:4px}
.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}.calendarTitle{font-size:19px;font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;font-size:12px;font-weight:800;color:#98a2b3;padding:4px}
.daycell{min-height:72px;border:1px solid #e3e7ed;border-radius:12px;background:#fff;padding:7px;font-size:12px}.daycell.blank{background:transparent;border-color:transparent}.daynum{font-weight:900;margin-bottom:6px}
.miniMarks{display:flex;flex-direction:column;gap:3px}.mark{border-radius:7px;padding:3px 4px;background:#f2f4f7;color:#667085;font-size:10px;font-weight:800}.mark.done{background:#e9f8f1;color:#08734a}
.legend{font-size:12px;color:var(--sub);margin-top:10px}.historyRows{margin-top:15px}.histRow{display:grid;grid-template-columns:95px 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f4;font-size:13px}.histRow b{font-size:13px}
.scope{margin-top:14px;background:#f8fafc;border:1px solid #e6eaf0;border-radius:14px;padding:12px 14px;font-size:13px;color:#58657a;line-height:1.6}
@media(max-width:760px){
  .profileGrid,.studyGrid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:27px}.question{font-size:21px}.metrics{grid-template-columns:1fr 1fr 1fr}.daycell{min-height:62px;padding:5px}.histRow{grid-template-columns:80px 1fr 1fr}.sectionTop{grid-template-columns:1fr auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="home" class="screen active">
    <div class="top"><div class="logo">오늘의 수학</div><div class="date" id="homeDate"></div></div>
    <section class="hero">
      <h1>예주·예연 학습방</h1>
      <p>매일 분수 기본연산 15문제 + 지금까지 배운 학년 누적복습 15문제.<br>풀고, 채점하고, 기록까지 남겨요.</p>
    </section>
    <div class="profileGrid" id="profiles"></div>
    <div class="toolbar"><button class="btn light" id="allRecordsBtn">전체 학습기록 보기</button></div>
  </div>

  <div id="dashboard" class="screen">
    <button class="back" data-go="home">← 학생 선택</button>
    <div class="dashHead">
      <div><div class="small" id="dashDate"></div><h1 id="dashName"></h1><div class="small" id="dashSubtitle"></div></div>
      <button class="btn light" id="recordBtn">학습기록</button>
    </div>
    <div class="studyGrid">
      <section class="studyCard">
        <div class="iconBox fracIcon">➗</div><h3>분수 기본연산 15</h3>
        <p>약분·통분·덧셈·뺄셈·곱셈·나눗셈을 매일 반복합니다.</p>
        <button class="btn primary startSection" data-mode="fraction">분수연산 시작</button>
        <div class="statusBox"><span id="fractionStatus">미학습</span><span id="fractionScore">-</span></div>
      </section>
      <section class="studyCard">
        <div class="iconBox reviewIcon">✏️</div><h3 id="reviewCardTitle">학년 누적복습 15</h3>
        <p id="reviewCardDesc"></p>
        <button class="btn primary startSection" data-mode="review">누적복습 시작</button>
        <div class="statusBox"><span id="reviewStatus">미학습</span><span id="reviewScore">-</span></div>
      </section>
    </div>
    <section class="recordCard">
      <h3>오늘 학습</h3><div class="small">두 세트를 모두 끝내면 오늘 학습 완료입니다.</div>
      <div class="progressWrap"><div class="progressBar" id="todayBar"></div></div>
      <div class="small" id="todayProgress"></div>
    </section>
    <section class="scope" id="scopeText"></section>
  </div>

  <div id="study" class="screen">
    <div class="sectionHead">
      <div class="sectionTop">
        <div class="sectionTitle"><button class="back" id="studyBack">← 오늘 학습</button><h2 id="studyTitle"></h2><div class="small" id="studySub"></div></div>
        <div class="timer" id="timer">00:00</div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="beginBtn">문제 풀기 시작</button>
        <button class="btn warn" id="finishBtn" disabled>학습 종료</button>
        <button class="btn light" id="answerBtn" disabled>정답 보기</button>
      </div>
      <div class="problemNav" id="problemNav"></div>
    </div>
    <main id="problemArea"></main>
    <div class="finishPanel" id="finishPanel">
      <h2 style="margin:0 0 12px">학습 결과</h2>
      <div class="metrics">
        <div class="metric"><div class="k">소요시간</div><div class="v" id="resultTime">-</div></div>
        <div class="metric"><div class="k">정답</div><div class="v" id="resultScore">-</div></div>
        <div class="metric"><div class="k">정답률</div><div class="v" id="resultRate">-</div></div>
      </div>
      <div class="scope" id="wrongSummary"></div>
      <div class="toolbar"><button class="btn primary" id="resultHome">오늘 학습으로</button><button class="btn light" id="wrongOnly">틀린 문제만 보기</button></div>
    </div>
  </div>

  <div id="records" class="screen">
    <button class="back" id="recordsBack">← 돌아가기</button>
    <div class="dashHead"><div><div class="small">학습 결과</div><h1 id="recordTitle">학습기록</h1></div><select id="recordProfile" style="width:auto"></select></div>
    <section class="recordCard">
      <div class="calendarHead"><button class="btn light" id="prevMonth">‹</button><div class="calendarTitle" id="calendarTitle"></div><button class="btn light" id="nextMonth">›</button></div>
      <div class="calendar" id="calendar"></div>
      <div class="legend">분수 = 분수연산 15문제 · 누적 = 학년 누적복습 15문제 · 초록색은 완료</div>
      <div class="historyRows" id="historyRows"></div>
    </section>
  </div>
</div>

<script>
const PROFILES = {
  yeju:{name:'예주',grade:'중학교 1학년',short:'중1',
    subtitle:'1학기 처음부터 현재 기본도형·공간에서 직선과 평면의 위치관계까지',
    scope:'출제 범위: 소인수분해·최대공약수·최소공배수 / 정수와 유리수 / 문자와 식 / 일차방정식 / 좌표와 그래프 / 기본도형 / 직선·평면의 위치관계. 아직 배우지 않은 작도·합동 이후 단원, 평면·입체도형 심화, 통계는 현재 제외합니다.'},
  yeyeon:{name:'예연',grade:'초등학교 5학년',short:'초5',
    subtitle:'5학년 1학기 처음부터 2학기 현재 분수의 곱셈·나눗셈까지',
    scope:'출제 범위: 자연수의 혼합계산 / 약수와 배수 / 규칙과 대응 / 약분과 통분 / 분수의 덧셈과 뺄셈 / 다각형의 둘레와 넓이 / 수의 범위와 어림하기 / 분수의 곱셈·나눗셈. 이후 합동과 대칭·소수의 곱셈·직육면체·평균과 가능성은 현재 제외합니다.'}
};
let currentProfile=null,currentMode=null,currentProblems=[],currentIndex=0;
let session={started:false,finished:false,startAt:0,elapsed:0,timer:null,grades:[],canvases:[]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function localDate(d=new Date()){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function prettyDate(d=new Date()){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d)}
const TODAY=localDate();
$('#homeDate').textContent=prettyDate(); $('#dashDate').textContent=prettyDate();

function show(id){ $$('.screen').forEach(x=>x.classList.remove('active')); $('#'+id).classList.add('active'); window.scrollTo({top:0,behavior:'instant'}); }
function storeKey(p){return 'familyMathPortal:v1:'+p}
function allRecords(p){try{return JSON.parse(localStorage.getItem(storeKey(p))||'{}')}catch{return {}}}
function getDayRecord(p,date=TODAY){return allRecords(p)[date]||{}}
function savePart(p,mode,data,date=TODAY){let all=allRecords(p); all[date]=all[date]||{}; all[date][mode]={...(all[date][mode]||{}),...data}; localStorage.setItem(storeKey(p),JSON.stringify(all));}
function statusInfo(p,mode){let x=getDayRecord(p)[mode]; if(!x)return ['미학습','-']; if(x.graded)return ['완료',`${x.score}/15 · ${Math.round(x.score/15*100)}%`]; if(x.done)return ['풀이완료 · 채점 전',fmt(x.time||0)]; return ['미학습','-'];}

function renderHome(){
  const box=$('#profiles'); box.innerHTML='';
  Object.entries(PROFILES).forEach(([id,p])=>{
    const r=getDayRecord(id), f=r.fraction, v=r.review;
    const el=document.createElement('button'); el.className='profile'; el.dataset.profile=id;
    el.innerHTML=`<div class="avatar">${id==='yeju'?'🌿':'🌼'}</div><h2>${p.name}</h2><div class="grade">${p.grade}</div>
      <div class="todayState"><span class="pill ${f&&f.done?'done':''}">분수 ${f&&f.done?'✓':'미완료'}</span><span class="pill ${v&&v.done?'done':''}">누적 ${v&&v.done?'✓':'미완료'}</span></div>`;
    box.appendChild(el);
  });
}
renderHome();

document.addEventListener('click',e=>{
  const p=e.target.closest('[data-profile]'); if(p){openDashboard(p.dataset.profile);return}
  const g=e.target.closest('[data-go]'); if(g){show(g.dataset.go);renderHome();return}
});
function openDashboard(id){
  currentProfile=id; let p=PROFILES[id];
  $('#dashName').textContent=`${p.name} · ${p.short}`;
  $('#dashSubtitle').textContent=p.subtitle;
  $('#reviewCardTitle').textContent=`${p.short} 누적복습 15`;
  $('#reviewCardDesc').textContent='1학기 첫 단원부터 지금 학교에서 배운 범위까지 매일 골고루 다시 풉니다.';
  $('#scopeText').innerHTML='<b>현재 출제범위</b><br>'+p.scope;
  refreshDashboard(); show('dashboard');
}
function refreshDashboard(){
  let [fs,fc]=statusInfo(currentProfile,'fraction'), [rs,rc]=statusInfo(currentProfile,'review');
  $('#fractionStatus').textContent=fs; $('#fractionScore').textContent=fc; $('#reviewStatus').textContent=rs; $('#reviewScore').textContent=rc;
  const d=getDayRecord(currentProfile); let n=(d.fraction&&d.fraction.done?1:0)+(d.review&&d.review.done?1:0);
  $('#todayBar').style.width=(n*50)+'%'; $('#todayProgress').textContent=n===2?'오늘 학습 완료 ✓':`${n}/2 세트 완료`;
}
$$('.startSection').forEach(b=>b.addEventListener('click',()=>openStudy(b.dataset.mode)));

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function RNG(seed){let x=seed>>>0;return()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
let GEN_SALT=0;
function rngFor(extra){return RNG(hash(`${TODAY}|${currentProfile}|${extra}|${GEN_SALT}`))}
function ri(r,a,b){return Math.floor(r()*(b-a+1))+a}

function cleanQuestionText(html){
  const d=document.createElement('div'); d.innerHTML=html;
  return (d.textContent||'').replace(/\s+/g,' ').trim();
}
function questionSignature(p){
  return `${p.topic}|${cleanQuestionText(p.prompt)}|${String(p.answer).trim()}`;
}
function generationHistoryKey(){return `familyMathQuestionHistory:v1:${currentProfile}:${currentMode}`}
function recentQuestionSignatures(){
  try{
    const all=JSON.parse(localStorage.getItem(generationHistoryKey())||'[]');
    return new Set(all.filter(x=>x.date!==TODAY).slice(-14).flatMap(x=>x.signatures||[]));
  }catch{return new Set()}
}
function validateProblemSet(list){
  if(!Array.isArray(list)||list.length!==15)return false;
  const seen=new Set(), recent=recentQuestionSignatures();
  for(const p of list){
    if(!p||!p.topic||!p.prompt||p.answer===undefined||p.answer===null||!p.explain)return false;
    const allText=`${p.prompt} ${p.answer} ${p.explain}`;
    if(/NaN|Infinity|undefined|null/i.test(allText))return false;
    const sig=questionSignature(p);
    if(seen.has(sig)||recent.has(sig))return false;
    seen.add(sig);
  }
  return true;
}
function rememberProblemSet(list){
  try{
    let all=JSON.parse(localStorage.getItem(generationHistoryKey())||'[]');
    all=all.filter(x=>x.date!==TODAY);
    all.push({date:TODAY,signatures:list.map(questionSignature)});
    if(all.length>21)all=all.slice(-21);
    localStorage.setItem(generationHistoryKey(),JSON.stringify(all));
  }catch{}
}
function safeGenerate(mode){

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function red(n,d){if(d<0){n=-n;d=-d}let g=gcd(n,d);return[n/g,d/g]}
function f(n,d){return `<span class="fraction"><span class="top">${n}</span><span class="bottom">${d}</span></span>`}
function fa(n,d){let [a,b]=red(n,d);if(b===1)return `${a}`;let sign=a<0?'-':'',aa=Math.abs(a);if(aa>b){let w=Math.floor(aa/b),m=aa%b;return `${sign}${w} ${m}/${b}`}return `${a}/${b}`}
function fh(n,d){let [a,b]=red(n,d);if(b===1)return `${a}`;let sign=a<0?'-':'',aa=Math.abs(a);if(aa>b){let w=Math.floor(aa/b),m=aa%b;return `${sign}${w}${f(m,b)}`}return f(a,b)}
function proper(r,min=3,max=12){for(;;){let d=ri(r,min,max),n=ri(r,1,d-1);if(gcd(n,d)===1)return[n,d]}}

  let w=ri(r,5,12),h=ri(r,4,9);q.push(Q('둘레와 넓이',`가로 ${w}cm, 세로 ${h}cm인 직사각형의 넓이를 구하세요.`,`${w*h}㎠`,`직사각형의 넓이 = 가로×세로 = ${w}×${h}=${w*h}㎠입니다.`,'가로×세로 공식을 사용하세요.'));
  let base=ri(r,6,14),height=ri(r,4,10);q.push(Q('둘레와 넓이',`밑변 ${base}cm, 높이 ${height}cm인 삼각형의 넓이를 구하세요.`,`${base*height/2}㎠`,`삼각형의 넓이 = 밑변×높이÷2 = ${base}×${height}÷2=${base*height/2}㎠입니다.`,'삼각형은 직사각형 넓이의 절반입니다.'));
  // 수의 범위와 어림 2
  let val=ri(r,31,89);q.push(Q('수의 범위',`${val} 이상 ${val+10} 미만인 자연수 중 가장 큰 수를 쓰세요.`,`${val+9}`,`${val+10}은 포함하지 않으므로 가장 큰 자연수는 ${val+9}입니다.`,'‘미만’은 그 수를 포함하지 않습니다.'));
  let num=ri(r,1234,9876);let round=Math.round(num/100)*100;q.push(Q('어림하기',`${num}을 백의 자리까지 반올림하세요.`,`${round}`,`십의 자리 숫자를 보고 반올림하면 ${round}입니다.`,'백의 자리까지 나타낼 때는 십의 자리 숫자를 봅니다.'));
  // 현재 분수 곱셈·나눗셈 4
  for(let i=0;i<2;i++){let a=proper(r,3,9),b=proper(r,3,9),rn=a[0]*b[0],rd=a[1]*b[1];q.push(Q('분수의 곱셈',`계산하세요. ${f(a[0],a[1])} × ${f(b[0],b[1])}`,fa(rn,rd),`분자끼리, 분모끼리 곱하고 약분하면 ${fh(rn,rd)}입니다.`,'곱하기 전에 약분할 수 있는지 보세요.'))}
  let da=proper(r,3,9),db=proper(r,3,9),drn=da[0]*db[1],drd=da[1]*db[0];q.push(Q('분수의 나눗셈',`계산하세요. ${f(da[0],da[1])} ÷ ${f(db[0],db[1])}`,fa(drn,drd),`나누는 분수 ${f(db[0],db[1])}를 뒤집어 곱하면 ${fh(drn,drd)}입니다.`,'두 번째 분수를 뒤집어 곱셈으로 바꾸세요.'));
  let ef1=proper(r,3,6),ef2=proper(r,3,6),ek=ri(r,2,4);
  let total=ef1[1]*ef2[1]*ek, used=total*ef1[0]/ef1[1], target=used*ef2[0]/ef2[1];
  q.push(Q('기출유형·서술형',
    `학교 텃밭의 넓이는 ${total}㎡입니다. 학생들은 전체 텃밭의 ${f(ef1[0],ef1[1])}을 채소밭으로 사용하고, 채소밭의 ${f(ef2[0],ef2[1])}에는 상추를 심기로 했습니다.<br><br>
    상추를 심는 넓이는 몇 ㎡인지 구하세요. 단, 답만 쓰지 말고
    ① 먼저 채소밭의 넓이를 구하는 식,
    ② 그중 상추밭의 넓이를 구하는 식,
    ③ 최종 답
    을 차례대로 쓰세요.`,
    `${target}㎡`,
    `먼저 채소밭은 ${total}×${f(ef1[0],ef1[1])}=${used}㎡입니다. 그중 상추밭은 ${used}×${f(ef2[0],ef2[1])}=${target}㎡입니다. 따라서 상추를 심는 넓이는 ${target}㎡입니다.`,
    `전체의 일부를 구한 뒤, 그 일부의 또 일부를 구하는 두 단계 문제입니다.`));
  return q;
}

function makeReview(){return currentProfile==='yeju'?makeYejuReview():makeYeyeonReview()}

function openStudy(mode){
  currentMode=mode; currentProblems=safeGenerate(mode); currentIndex=0;
  session={started:false,finished:false,startAt:0,elapsed:0,timer:null,grades:Array(15).fill(null),canvases:[]};
  $('#studyTitle').textContent=mode==='fraction'?'분수 기본연산 15':`${PROFILES[currentProfile].short} 누적복습 15`;
  $('#studySub').textContent=`${PROFILES[currentProfile].name} · ${prettyDate()} · ${mode==='fraction'?'매일 계산훈련':'배운 범위 누적복습'} · Apple Pencil로 필기, 손가락으로 스크롤`;
  $('#timer').textContent='00:00'; $('#beginBtn').disabled=false; $('#finishBtn').disabled=true; $('#answerBtn').disabled=true; $('#finishPanel').classList.remove('show');
  renderProblems(); show('study');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const cs=session.canvases[0];
      if(cs) cs.resize();
    });
  });
}
function renderProblems(){
  $('#problemArea').innerHTML=''; $('#problemNav').innerHTML='';
  currentProblems.forEach((p,i)=>{
    let nav=document.createElement('button');nav.className='navDot'+(i===0?' active':'');nav.textContent=i+1;nav.dataset.jump=i;$('#problemNav').appendChild(nav);
    let el=document.createElement('section');el.className='problem'+(i===0?' active':'');el.dataset.problem=i;
    el.innerHTML=`<div class="problemMeta"><div class="num">${i+1} / 15</div><div class="tag">${p.topic}</div></div>
      <div class="question">${p.prompt}</div>${p.figure?`<div class="figure">${p.figure}</div>`:''}
      <div class="canvasWrap"><canvas id="cv${i}"></canvas></div>
      <div class="penTools"><button class="tool active" data-act="pen" data-i="${i}">펜</button><button class="tool" data-act="eraser" data-i="${i}">지우개</button><button class="tool" data-act="undo" data-i="${i}">실행취소</button><button class="tool" data-act="clear" data-i="${i}">전체지우기</button>${p.hint?`<button class="tool" data-act="hint" data-i="${i}">힌트</button>`:''}</div>
      <div class="hint" id="hint${i}">${p.hint||''}</div>
      <div class="answer" id="ans${i}"><div class="answerRow"><div class="answerBadge">정답: ${p.answer}</div><button class="gradeBtn ok" data-grade="correct" data-i="${i}">○ 맞음</button><button class="gradeBtn no" data-grade="wrong" data-i="${i}">× 틀림</button><button class="tool" data-act="explain" data-i="${i}">풀이방법</button></div><div class="explain" id="exp${i}">${p.explain}</div></div>
      <div class="bottomNav"><button class="btn light prevProblem" data-i="${i}" ${i===0?'disabled':''}>이전</button><button class="btn soft nextProblem" data-i="${i}" ${i===14?'disabled':''}>다음</button></div>`;
    $('#problemArea').appendChild(el);
  });
  initCanvases();
}
function goProblem(i){
  currentIndex=Math.max(0,Math.min(14,i));
  $$('.problem').forEach((x,k)=>x.classList.toggle('active',k===currentIndex));
  $$('.navDot').forEach((x,k)=>x.classList.toggle('active',k===currentIndex));
  $$('.navDot')[currentIndex].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});

  // Critical for iPad Safari:
  // problems 2~15 were hidden at first render, so their canvas had no usable size.
  // Resize only after the selected problem is visible.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const cs=session.canvases[currentIndex];
      if(cs) cs.resize();
    });
  });
  window.scrollTo({top:$('.sectionHead').offsetHeight,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  if(e.target.dataset.jump!==undefined){goProblem(+e.target.dataset.jump);return}
  if(e.target.classList.contains('prevProblem')){goProblem(+e.target.dataset.i-1);return}
  if(e.target.classList.contains('nextProblem')){goProblem(+e.target.dataset.i+1);return}
  const act=e.target.dataset.act;
  if(act){
    let i=+e.target.dataset.i,cs=session.canvases[i];
    if(act==='pen'||act==='eraser'){cs.mode=act;e.target.parentElement.querySelectorAll('[data-act="pen"],[data-act="eraser"]').forEach(b=>b.classList.remove('active'));e.target.classList.add('active')}
    if(act==='undo'){cs.strokes.pop();redraw(cs)}
    if(act==='clear'){cs.strokes=[];redraw(cs)}
    if(act==='hint')$('#hint'+i).classList.toggle('show');
    if(act==='explain')$('#exp'+i).classList.toggle('show');
  }
  if(e.target.dataset.grade){
    let i=+e.target.dataset.i;session.grades[i]=e.target.dataset.grade;
    e.target.parentElement.querySelectorAll('.gradeBtn').forEach(b=>b.classList.remove('sel'));e.target.classList.add('sel');
    let dot=$$('.navDot')[i];dot.classList.remove('graded-ok','graded-no');dot.classList.add(e.target.dataset.grade==='correct'?'graded-ok':'graded-no');
    updateGrade();
  }
});
function initCanvases(){
  session.canvases=[];
  currentProblems.forEach((_,i)=>{
    const c=$('#cv'+i),ctx=c.getContext('2d'),
      cs={c,ctx,strokes:[],mode:'pen',drawing:false,current:null,fingerScroll:false,lastY:0,lastPenPointer:0};
    session.canvases.push(cs);

    function resize(){
      const rect=c.getBoundingClientRect();
      if(rect.width<10 || rect.height<10) return;
      const dpr=Math.max(1,devicePixelRatio||1);
      const targetW=Math.floor(rect.width*dpr), targetH=Math.floor(rect.height*dpr);
      if(c.width!==targetW || c.height!==targetH){
        c.width=targetW; c.height=targetH;
      }
      ctx.setTransform(dpr,0,0,dpr,0,0);
      redraw(cs);
    }
    cs.resize=resize;
    // Only the first problem is visible at initial render.
    // Hidden canvases are resized when their problem becomes active.
    resize();

    // Extra guard for orientation changes / delayed layout on iPad Safari.
    if(window.ResizeObserver){
      const ro=new ResizeObserver(()=>resize());
      ro.observe(c.parentElement);
      cs.resizeObserver=ro;
    }

    function pointFromClient(x,y,pressure=.5){
      const rr=c.getBoundingClientRect();
      return {x:x-rr.left,y:y-rr.top,p:pressure||.5};
    }
    function startStroke(pt){
      cs.drawing=true; cs.current={mode:cs.mode,pts:[pt]}; draw(cs,pt,pt,cs.mode);
    }
    function moveStroke(pt){
      if(!cs.drawing||!cs.current)return;
      const a=cs.current.pts[cs.current.pts.length-1];
      cs.current.pts.push(pt); draw(cs,a,pt,cs.mode);
    }
    function endStroke(){
      if(cs.drawing){
        cs.drawing=false;
        if(cs.current){cs.strokes.push(cs.current);cs.current=null}
      }
    }

    // Modern Safari: Apple Pencil normally arrives as pointerType="pen".
    c.addEventListener('pointerdown',e=>{
      if(!session.started||session.finished)return;
      if(e.pointerType==='pen'||e.pointerType==='mouse'){
        e.preventDefault();
        cs.lastPenPointer=Date.now();
        try{c.setPointerCapture(e.pointerId)}catch{}
        startStroke(pointFromClient(e.clientX,e.clientY,e.pressure||.5));
      }
    },{passive:false});
    c.addEventListener('pointermove',e=>{
      if((e.pointerType==='pen'||e.pointerType==='mouse')&&cs.drawing){
        e.preventDefault();
        moveStroke(pointFromClient(e.clientX,e.clientY,e.pressure||.5));
      }
    },{passive:false});
    c.addEventListener('pointerup',e=>{
      if(e.pointerType==='pen'||e.pointerType==='mouse')endStroke();
    });
    c.addEventListener('pointercancel',e=>{
      if(e.pointerType==='pen'||e.pointerType==='mouse')endStroke();
    });

    // iPadOS fallback: some Safari/WebView versions expose Apple Pencil as a stylus Touch.
    c.addEventListener('touchstart',e=>{
      if(!session.started||session.finished)return;
      const t=e.changedTouches[0];
      if(!t)return;
      const stylus=(t.touchType==='stylus');
      if(stylus){
        // Avoid double-drawing if the same Pencil contact already produced a PointerEvent.
        if(Date.now()-cs.lastPenPointer<80)return;
        e.preventDefault();
        startStroke(pointFromClient(t.clientX,t.clientY,t.force||.5));
      }else{
        // Finger remains usable for scrolling even though canvas touch-action is none.
        e.preventDefault();
        cs.fingerScroll=true; cs.lastY=t.clientY;
      }
    },{passive:false});
    c.addEventListener('touchmove',e=>{
      const t=e.changedTouches[0]; if(!t)return;
      const stylus=(t.touchType==='stylus');
      if(stylus&&cs.drawing){
        e.preventDefault();
        moveStroke(pointFromClient(t.clientX,t.clientY,t.force||.5));
      }else if(cs.fingerScroll){
        e.preventDefault();
        const dy=cs.lastY-t.clientY;
        window.scrollBy(0,dy); cs.lastY=t.clientY;
      }
    },{passive:false});
    c.addEventListener('touchend',e=>{
      const t=e.changedTouches[0];
      if(t&&t.touchType==='stylus')endStroke();
      cs.fingerScroll=false;
    },{passive:false});
    c.addEventListener('touchcancel',()=>{endStroke();cs.fingerScroll=false},{passive:false});
  });
}
function draw(cs,a,b,mode){let x=cs.ctx;x.save();x.lineCap='round';x.lineJoin='round';if(mode==='eraser'){x.globalCompositeOperation='destination-out';x.lineWidth=20;x.strokeStyle='#000'}else{x.globalCompositeOperation='source-over';x.lineWidth=1.8+Math.max(.2,Math.min(1,b.p))*2;x.strokeStyle='#172033'}x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.restore()}
function redraw(cs){let rr=cs.c.getBoundingClientRect();cs.ctx.clearRect(0,0,rr.width,rr.height);cs.strokes.forEach(s=>{if(s.pts.length===1)draw(cs,s.pts[0],s.pts[0],s.mode);for(let j=1;j<s.pts.length;j++)draw(cs,s.pts[j-1],s.pts[j],s.mode)})}
window.addEventListener('resize',()=>session.canvases.forEach(c=>c.resize()));
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function tick(){if(session.started&&!session.finished){session.elapsed=Date.now()-session.startAt;$('#timer').textContent=fmt(session.elapsed)}}
$('#beginBtn').onclick=()=>{session.started=true;session.startAt=Date.now();session.timer=setInterval(tick,200);$('#beginBtn').disabled=true;$('#finishBtn').disabled=false}
$('#finishBtn').onclick=()=>{if(!session.started||session.finished)return;session.finished=true;clearInterval(session.timer);session.elapsed=Date.now()-session.startAt;$('#timer').textContent=fmt(session.elapsed);$('#finishBtn').disabled=true;$('#answerBtn').disabled=false;savePart(currentProfile,currentMode,{done:true,time:session.elapsed,graded:false,finishedAt:new Date().toISOString()});}
$('#answerBtn').onclick=()=>{$$('.answer').forEach(x=>x.classList.add('show'));$('#answerBtn').disabled=true}
function updateGrade(){
  let n=session.grades.filter(Boolean).length;if(n<15)return;
  let score=session.grades.filter(x=>x==='correct').length,rate=Math.round(score/15*100);
  let wrong=session.grades.map((x,i)=>x==='wrong'?currentProblems[i].topic:null).filter(Boolean),cnt={};wrong.forEach(t=>cnt[t]=(cnt[t]||0)+1);
  savePart(currentProfile,currentMode,{done:true,time:session.elapsed,graded:true,score,rate,grades:session.grades,wrongTopics:cnt});
  $('#resultTime').textContent=fmt(session.elapsed);$('#resultScore').textContent=`${score}/15`;$('#resultRate').textContent=`${rate}%`;
  $('#wrongSummary').innerHTML=wrong.length?`<b>다시 볼 영역</b><br>${Object.entries(cnt).map(([k,v])=>`${k} ${v}문제`).join(' · ')}`:'<b>15문제 모두 맞았습니다.</b>';
  $('#finishPanel').classList.add('show');$('#finishPanel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('#studyBack').onclick=()=>{if(session.started&&!session.finished&&!confirm('아직 학습 중입니다. 오늘 학습 화면으로 돌아갈까요?'))return;refreshDashboard();show('dashboard')}
$('#resultHome').onclick=()=>{refreshDashboard();show('dashboard')}
$('#wrongOnly').onclick=()=>{let first=-1;$$('.problem').forEach((p,i)=>{let hide=session.grades[i]!=='wrong';p.style.display=hide?'none':'';if(!hide&&first<0)first=i});if(first>=0){currentIndex=first;$$('.problem').forEach((x,k)=>x.classList.toggle('active',k===first));window.scrollTo({top:$('.sectionHead').offsetHeight,behavior:'smooth'})}}

let recordMonth=new Date();recordMonth.setDate(1);
function openRecords(profile=currentProfile||'yeju'){
  $('#recordProfile').innerHTML=Object.entries(PROFILES).map(([id,p])=>`<option value="${id}">${p.name} · ${p.short}</option>`).join('');
  $('#recordProfile').value=profile; recordMonth=new Date();recordMonth.setDate(1);renderCalendar();show('records');
}
$('#recordBtn').onclick=()=>openRecords(currentProfile);$('#allRecordsBtn').onclick=()=>openRecords('yeju');
$('#recordsBack').onclick=()=>{if(currentProfile){refreshDashboard();show('dashboard')}else show('home')}
$('#recordProfile').onchange=renderCalendar;$('#prevMonth').onclick=()=>{recordMonth.setMonth(recordMonth.getMonth()-1);renderCalendar()};$('#nextMonth').onclick=()=>{let nxt=new Date(recordMonth);nxt.setMonth(nxt.getMonth()+1);let now=new Date();now.setDate(1);if(nxt<=now){recordMonth=nxt;renderCalendar()}};
function renderCalendar(){
  let p=$('#recordProfile').value,all=allRecords(p),y=recordMonth.getFullYear(),m=recordMonth.getMonth();
  $('#recordTitle').textContent=`${PROFILES[p].name} 학습기록`;$('#calendarTitle').textContent=`${y}년 ${m+1}월`;
  let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),html=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<first;i++)html+='<div class="daycell blank"></div>';
  for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,r=all[key]||{},future=key>TODAY;
    html+=`<div class="daycell ${future?'blank':''}"><div class="daynum">${d}</div>${future?'':`<div class="miniMarks"><span class="mark ${r.fraction&&r.fraction.done?'done':''}">분수 ${r.fraction&&r.fraction.done?'✓':'-'}</span><span class="mark ${r.review&&r.review.done?'done':''}">누적 ${r.review&&r.review.done?'✓':'-'}</span></div>`}</div>`;
  }
  $('#calendar').innerHTML=html;
  let rows=Object.keys(all).sort().reverse().slice(0,12).map(date=>{let r=all[date],f=r.fraction,v=r.review;return `<div class="histRow"><b>${date.slice(5).replace('-','/')}</b><span>분수 ${f&&f.done?(f.graded?`${f.score}/15 · ${fmt(f.time)}`:`완료 · ${fmt(f.time)}`):'미학습'}</span><span>누적 ${v&&v.done?(v.graded?`${v.score}/15 · ${fmt(v.time)}`:`완료 · ${fmt(v.time)}`):'미학습'}</span></div>`}).join('');
  $('#historyRows').innerHTML=rows||'<div class="small" style="padding:14px 0">아직 저장된 학습기록이 없습니다.</div>';
}
